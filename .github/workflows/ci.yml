name: Artwork
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run render
      - run: npm run render -- examples/synthetic-digest.json examples/synthetic-digest.svg
      - run: git diff --exit-code -- examples/
